[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemistry-video-service"
version = "0.1.0"
description = "Domain contracts for a chemistry video generation service"
requires-python = ">=3.9"
dependencies = [
  "chempy>=0.10",
  "fastapi>=0.110,<1.0",
  "openai>=1.0,<2.0",
  "pint>=0.24",
  "pydantic>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0",
  "rdkit>=2023.9",
  "sympy>=1.12",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
